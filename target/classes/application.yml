server:
  port: 8081

spring:
  application:
    name: qa-assistant

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/documentqa}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  sql:
    init:
      mode: never

  ai:
    model:
      chat: ollama
      embedding: ollama

    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:llama3.2}
          temperature: 0.1
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}

    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 768
        index-type: HNSW
        distance-type: COSINE_DISTANCE

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

rag:
  top-k: ${RAG_TOP_K:5}
  similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0}