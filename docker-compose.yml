services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: qa-assistant-postgres
    environment:
      POSTGRES_DB: documentqa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - qa_pgdata:/var/lib/postgresql/data
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d documentqa"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  qa_pgdata:
